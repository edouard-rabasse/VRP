# sweep.yaml
program: train.py
name: sweep_vgg  # 👈 Nom explicite ici
project: VRP

command:
  - ${env}
  - python
  - ${program}
  - ${args_no_hyphens}

# On cherche à maximiser la métrique val_accuracy (à adapter)
metric:
  name: val_acc
  goal: maximize

method: bayes   # ou random, bayes...

parameters:
  model:
    values: ["vgg"]

  model.params.epochs:
    values: [30, 40,50]
  save_model:
    values: [true]

  batch_size:
    values: [16, 32]

  model.params.learning_rate:
    values: [0.0001, 0.00005, 0.00001]

  # Optionnel : Hydra ignorera cette clé pour les modèles qui ne l'utilisent pas
  model.freeze:
    values: [false]
  data:
    values: ["config7_new"]
  data.cfg_number:
    values: [7]
